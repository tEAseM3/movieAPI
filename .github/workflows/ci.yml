name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test_db
      SECRET_KEY: 3CB7B97A90F0044B69A7BA0E9F078338 
      TMDB_API_KEY: test
      ENVIRONMENT: test
      CORS_ORIGINS: "[]"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Ruff code style
        run: python -m ruff check .

      - name: Check Ruff code formatting
        run: python -m ruff format --check .

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run pytests
        run: python -m pytest -q