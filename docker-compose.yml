services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movie_api
      POSTGRES_USER: movie_api
      POSTGRES_PASSWORD: movie_api

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_api -d movie_api"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg2://movie_api:movie_api@db:5432/movie_api
      SECRET_KEY: ${SECRET_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}

    ports:
      - "8000:8000"

  seed:
    build: .
    command: python -m scripts.seed_all

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg2://movie_api:movie_api@db:5432/movie_api
      SECRET_KEY: ${SECRET_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}

volumes:
  postgres_data: